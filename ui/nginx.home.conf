# One origin for the SPA and the API.
#
# `/api`, `/health` and `/talk` go to the API container; everything else is
# the SPA, with the usual history fallback. Keeping both behind one name is
# what lets the browser attach the `.home.space` `Home-Session` cookie to API
# calls — SSO depends on it, and so does the re-check on /api/account/refresh.

server {
  listen 6008;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The daemon posts flow windows and the export endpoints stream bundles.
  client_max_body_size 32m;

  # ---- API ----------------------------------------------------------------
  #
  # The trailing slash is deliberately absent on both sides: `proxy_pass
  # http://api:8000;` with no URI preserves the full original path, so
  # /api/projects arrives as /api/projects rather than being rewritten.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # The coach streams its replies over SSE. Buffering here would hold the
    # whole answer back and deliver it as one lump.
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
    access_log off;
  }

  location /talk/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  # ---- SPA ----------------------------------------------------------------

  # Content-hashed filenames — safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker must never be served stale, or an old worker keeps
  # its old precache list and the app never updates. Same rule the Firebase
  # hosting config carried.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
