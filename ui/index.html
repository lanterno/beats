<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#8CC1E2" />
    <!-- The stored hour, before first paint, so dusk does not flash the
         afternoon. client/shared/lib/useTheme.ts owns both keys and the
         dusk sky's hex from here on. -->
    <script>
      try {
        var root = document.documentElement;
        if (localStorage.getItem("beats_theme") === "dusk") {
          root.dataset.theme = "dusk";
          document.querySelector('meta[name="theme-color"]').content = "#1A2446";
        }
        var density = localStorage.getItem("beats_density");
        if (density === "compact" || density === "spacious") root.dataset.density = density;
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>%APP_NAME% — Your time, tracked while you work.</title>
    <meta
      name="description"
      content="%APP_NAME% is a free, open-source rhythm system. A background daemon catches your sessions across your editor, desktop, and an optional wall clock — then a coach helps you review the week."
    />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:title" content="%APP_NAME% — Your time, tracked while you work." />
    <meta
      property="og:description"
      content="Free, open-source time-tracking. A background daemon catches your sessions across editor, desktop, and an optional wall clock."
    />
    <meta property="og:url" content="https://lifepete.com/" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%APP_NAME% — Your time, tracked while you work." />
    <meta
      name="twitter:description"
      content="Free, open-source time-tracking. A background daemon catches your sessions across editor, desktop, and an optional wall clock."
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
