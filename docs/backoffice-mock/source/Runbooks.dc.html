<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runbooks</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./backoffice.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&amp;family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bo" data-hour="{{hour}}">
  <div class="shell">
    <div class="side"><dc-import name="Sidebar" active="runbooks" hint-size="100%,860px"></dc-import></div>
    <main class="main"><div class="wrap">
      <dc-import name="Topbar" hint-size="100%,44px"></dc-import>
      <header class="ph">
        <div class="ph-t">
          <h1 class="h1">What to do when it happens.</h1>
          <p class="lead">Written while calm, read while not. Every alert and every queue item links to the one that fits, and a runbook nobody has reviewed in six months says so.</p>
        </div>
      </header>

      <div class="lean">
        <nav class="p narrow" aria-label="Runbooks" style="padding: 10px; flex: 1 1 280px">
          <sc-for list="{{books}}" as="b" hint-placeholder-count="9">
            <button type="button" class="nav {{b.on}}" onClick="{{b.pick}}" style="width: 100%; background-color: transparent; border: 0; cursor: pointer; text-align: left; min-height: 44px; font: inherit; font-size: 13.5px">
              <span style="min-width: 0">{{b.title}}</span>
              <sc-if value="{{b.stale}}" hint-placeholder-val="{{false}}"><span class="chip warn" style="margin-left: auto">Stale</span></sc-if>
            </button>
          </sc-for>
        </nav>

        <article class="p up wide" aria-label="{{open.title}}">
          <div class="p-h" style="padding-top: 20px">
            <h2 style="font: 800 21px/1.25 var(--display)">{{open.title}}</h2>
            <p class="p-n">{{open.when}}</p>
          </div>
          <div class="p-b">
            <div class="bar-row" style="margin-bottom: 14px">
              <span class="chip {{open.reviewTone}}">Reviewed {{open.reviewed}}</span>
              <span class="cap push">{{progress}}</span>
            </div>
            <ol style="list-style: none; margin: 0; padding: 0">
              <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
                <li style="padding: 9px 0; border-top: 1px solid var(--hairline)">
                  <label class="check">
                    <input type="checkbox" checked="{{s.done}}" onChange="{{s.toggle}}">
                    <span style="min-width: 0">
                      <span class="b">{{s.title}}</span>
                      <span style="display: block; color: var(--ink-muted); font-size: 13.5px">{{s.detail}}</span>
                    </span>
                  </label>
                  <sc-if value="{{s.href}}" hint-placeholder-val="{{false}}">
                    <div style="padding: 6px 0 0 26px"><a class="lk" href="{{s.href}}" style="font-size: 13.5px">{{s.link}}</a></div>
                  </sc-if>
                </li>
              </sc-for>
            </ol>
            <div style="margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--wash); font-size: 13.5px">
              <span class="b">Do not:</span> {{open.never}}
            </div>
          </div>
        </article>
      </div>
    </div></main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hour":{"editor":"enum","options":["afternoon","dusk"],"default":"afternoon"},"$preview":{"width":1440,"height":1020}}'>
class Component extends DCLogic {
  state = { open: 'release', done: {} };
  renderVals() {
    const s = (title, detail, href, link) => ({ title, detail, href: href || '', link: link || '' });
    const all = [
      { id: 'release', title: 'API errors after a release', when: 'Use this when the 5xx alert fires within an hour of a deploy.', used: '09:02 today', reviewed: '2 October', reviewTone: 'good',
        never: 're-run an old build to roll back. A build older than what is live succeeds without deploying.',
        steps: [
          s('Compare the start of the errors with the last release', 'If errors began before the release, this is the wrong runbook.', 'Releases.dc.html', 'Open the releases'),
          s('Name the blast radius', 'Which routes, what share of requests, roughly how many accounts.', 'IncidentRoom.dc.html', 'Open the incident room'),
          s('Revert the change on main', 'This is the way back: there is no control here that moves traffic. The deploy that follows is the fix, so watch the build.', 'Releases.dc.html', 'Open the releases'),
          s('Check the two halves still agree', 'The web app and the API ship separately. An old web app against a new API is a real state.'),
          s('Tell people, then write it up', 'A customer update if writes were lost, a post-incident note within five days.')
        ] },
      { id: 'job', title: 'A job failed three times', when: 'Use this when a job lands in failed, or the job alert emails you.', used: '4 September', reviewed: '2 October', reviewTone: 'good',
        never: 'retry before reading why it failed. The rules run again at run time and may refuse for a good reason.',
        steps: [
          s('Read the last attempt', 'The error and how far it got, on the job.', 'Jobs.dc.html', 'Open the job'),
          s('Decide whether the subject has changed', 'An organisation that regained an owner should not be deleted.'),
          s('Retry, or cancel and write down why', 'A retry goes back through the runner and is audited like the first run.'),
          s('Confirm the outcome', 'Queued, running, done. Check the audit shows it.', 'Audit.dc.html', 'Open the audit')
        ] },
      { id: 'owner', title: 'An organisation lost its owner', when: 'Use this only after someone from the organisation has asked.', used: '12 October', reviewed: '30 August', reviewTone: 'good',
        never: 'act on an organisation that still has an owner. A suspended owner still counts as one.',
        steps: [
          s('Find out who is asking', 'The request must come from the person who will become owner.'),
          s('Confirm they hold the highest active role', 'The back office refuses anyone else.', 'Org.dc.html', 'Open the organisation'),
          s('Grant ownership to the requester', 'The command is recorded in the audit on both sides.'),
          s('Write back and close the item', 'Tell them it is done and which address now owns it.')
        ] },
      { id: 'down', title: 'The API is down', when: 'Use this when the uptime check fails from two or more regions.', used: '18 July', reviewed: '12 March', reviewTone: 'warn', stale: true,
        never: 'keep a stale deploy lock in place while you wait. The next build breaks it after 40 minutes.',
        steps: [s('Check the uptime history and the instance count', 'Rule out a check that is itself broken.', 'Capacity.dc.html', 'Open capacity'), s('Check the database', 'Atlas status and connection count.'), s('Check the last release', 'If it just shipped, go to the release runbook.', 'Releases.dc.html', 'Open the releases')] },
      { id: 'cap', title: 'A coach cap is close', when: 'Use this when an account reaches 80% of its monthly cap.', used: 'Yesterday', reviewed: '2 October', reviewTone: 'good',
        never: 'ask to read the conversation. Spend, tokens and the model are all this can show.',
        steps: [s('Compare the pace with what is usual for the account', 'A one-off spike and a new habit need different answers.', 'Account.dc.html', 'Open the account'), s('Raise the cap, or leave it', 'Leaving it means coach stops when it is reached. Raising it is reversible.')] },
      { id: 'signup', title: 'A signup spike', when: 'Use this when signups pass four times the usual hour.', used: 'Today', reviewed: '2 October', reviewTone: 'good',
        never: 'suspend in bulk on suspicion. Look at what the accounts have done first.',
        steps: [s('See how many share a network', 'Only the count, never a list of people.', 'Trust.dc.html', 'Open trust and safety'), s('Check whether any have written anything', 'Accounts that did nothing cost nothing yet.'), s('Tighten the limit on signups', 'Reversible, and it expires on its own.', 'Access.dc.html', 'Open the controls')] },
      { id: 'erasure', title: 'Someone asks for erasure', when: 'Use this when a request reaches the privacy address.', used: '28 October', reviewed: '2 October', reviewTone: 'good',
        never: 'give them an export from here. A person can take their own export from Settings.',
        steps: [s('Log the day it arrived', 'The month starts then, not when you get to it.', 'Compliance.dc.html', 'Open compliance'), s('Check it comes from the address on the account', 'Reply from the privacy address to confirm.'), s('Queue the erasure', 'It waits seven days and suspends the account meanwhile.', 'Review.dc.html', 'Review the command'), s('Tell them when it is done', 'Close the request with the date.')] },
      { id: 'access', title: 'The quarterly access review', when: 'Use this once a quarter.', used: '12 August', reviewed: '12 August', reviewTone: 'good',
        never: 'add a viewer before the privacy text names them.',
        steps: [s('Confirm everyone on the list still needs access', 'Remove anyone who does not.', 'Access.dc.html', 'Open access'), s('Read the audit for anything unexpected', 'Commands you do not remember are the finding.', 'Audit.dc.html', 'Open the audit'), s('Record the review', 'Date, who did it, and what changed.')] },
      { id: 'lock', title: 'The deploy lock is stuck', when: 'Use this when a build waits on a lock nobody holds.', used: 'Never', reviewed: '12 March', reviewTone: 'warn', stale: true,
        never: 'break the lock while a build is running. Check the builds first.',
        steps: [s('Confirm no build is running', 'Look at the build list.', 'Releases.dc.html', 'Open the releases'), s('Wait, or break it', 'The next build breaks a lock older than 40 minutes on its own.')] }
    ];
    const open = all.find((b) => b.id === this.state.open);
    const doneFor = this.state.done[open.id] || {};
    const count = open.steps.filter((_, i) => doneFor[i]).length;
    return {
      hour: this.props.hour ?? 'afternoon',
      open,
      progress: count + ' of ' + open.steps.length + ' done',
      books: all.map((b) => ({ ...b, stale: !!b.stale, on: b.id === open.id ? 'on' : '', pick: () => this.setState({ open: b.id }) })),
      steps: open.steps.map((st, i) => ({ ...st, done: !!doneFor[i], toggle: () => this.setState({ done: { ...this.state.done, [open.id]: { ...doneFor, [i]: !doneFor[i] } } }) }))
    };
  }
}
</script>
</body>
</html>
