<!doctype html>
<!-- Google Play's feature graphic, 1024×500. render.sh turns it into
     android/en-US/images/featureGraphic.png with headless Chrome. The mark
     is shared/brand/mark.svg; the ring on the right is Today's hero. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; position: relative;
    background: linear-gradient(180deg, #8cc1e2 0%, #bcddee 40%, #e4f0f1 82%, #e9f2e6 100%);
    font-family: 'Zen Maru Gothic', sans-serif; color: #2B3A44;
  }
  .hills { position: absolute; left: 0; bottom: 0; }
  .brand { position: absolute; left: 84px; top: 118px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 22px; }
  .name { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 84px; letter-spacing: -1px; line-height: 1; }
  .line { font-weight: 700; font-size: 32px; color: #3D5160; }
  .card {
    position: absolute; right: 92px; top: 56px; width: 320px; height: 320px; border-radius: 48px;
    background: rgba(255, 253, 247, 0.96);
    box-shadow: 0 2px 4px rgba(43, 58, 68, 0.08), 0 24px 60px rgba(43, 58, 68, 0.16);
    display: flex; align-items: center; justify-content: center;
  }
  .inside { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 10px; border-radius: 999px; background: rgba(79, 143, 214, 0.16); font-weight: 700; font-size: 17px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #4F8FD6; }
  .clock { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .since { font-size: 16px; color: #5C6770; }
</style>
</head>
<body>
  <svg class="hills" width="1024" height="170" viewBox="0 0 1024 170" aria-hidden="true">
    <path d="M0 92 C220 46 420 70 600 88 S880 52 1024 70 V170 H0Z" fill="#B9D9A8"/>
    <path d="M0 128 C200 104 400 118 580 110 S860 96 1024 112 V170 H0Z" fill="#8AC07C"/>
    <path d="M0 154 C240 140 480 150 700 144 S920 140 1024 146 V170 H0Z" fill="#5C9F5E"/>
  </svg>

  <div class="brand">
    <div class="row">
      <svg width="104" height="104" viewBox="0 0 120 120" aria-hidden="true">
        <rect width="120" height="120" rx="27" fill="#1A2446"/>
        <circle cx="60" cy="60" r="34" fill="none" stroke="#2E3E6E" stroke-width="8"/>
        <path d="M60 26A34 34 0 1 1 30.56 77" fill="none" stroke="#F5C35E" stroke-width="8" stroke-linecap="round"/>
        <circle cx="30.56" cy="77" r="9" fill="#F5C35E"/>
      </svg>
      <div class="name">LifePete</div>
    </div>
    <div class="line">Your day, on one ring.</div>
  </div>

  <div class="card">
    <svg width="264" height="264" viewBox="0 0 264 264" aria-hidden="true">
      <circle cx="132" cy="132" r="112" fill="none" stroke="#D3E2EA" stroke-width="18"/>
      <circle cx="132" cy="132" r="112" fill="none" stroke="#F2B233" stroke-width="18" stroke-linecap="round"
              stroke-dasharray="463.7 703.7" transform="rotate(-90 132 132)"/>
      <circle cx="38" cy="193" r="17" fill="#F2B233" stroke="#FFFDF7" stroke-width="5"/>
    </svg>
    <div class="inside">
      <span class="chip"><span class="dot"></span>Northwind</span>
      <span class="clock">1:24:07</span>
      <span class="since">since 9:41</span>
    </div>
  </div>
</body>
</html>
