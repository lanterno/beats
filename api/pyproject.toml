[project]
name = "beats"
version = "0.3.0"
description = "A way to keep track of how I spend my time"
authors = [{ name = "Ahmed Elghareeb", email = "a@elghareeb.space" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "dnspython>=2.8.0",
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.17.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "uvicorn>=0.50.2",
    "webauthn>=3.0.0",
    "python-multipart>=0.0.29",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    # Imported directly by test_coach.py, which builds a real response object to
    # hand to anthropic.APIStatusError. It arrives transitively with anthropic
    # 1.x, but a direct import should be declared.
    "httpx2>=2.0",
    "ipython>=9.13.0",
    "ruff>=0.15.20",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers[mongodb]>=4.14.2",
    "ty>=0.0.56",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beats"]

[tool.hatch.build.targets.sdist]
include = ["src/beats", "README.md", "LICENSE"]

[tool.ruff]
# Target the runtime set in Docker and CI; ruff uses this to enable proper lint rules.
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Still a focused ruleset — every rule here was enabled against a clean tree, so
# a violation means something new. Deliberately omitted: S (asserts in tests),
# TC (import churn), TRY/EM (message style), ARG (fixture params are meant to be
# unused), N818 (the domain's exceptions read better without an Error suffix),
# and ERA — every one of its hits here was a prose comment that merely parsed
# as code, and there is no commented-out code in the tree for it to catch.
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "C4",     # comprehensions
    "PT",     # pytest style
    "ASYNC",  # blocking calls in async functions
    "LOG",    # logging misuse
    "G",      # logging format — lazy %s over eager f-strings
    "PTH",    # pathlib over os.path
    "BLE",    # blind except — each one must be an explicit, noqa'd decision
    "RUF",    # ruff's own
]
ignore = [
    "B008",     # FastAPI's Query/Depends pattern is a call in a default
    "RUF001",   # the prose here uses real typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ty.terminal]
# Still false, but the number is now small enough to be worth finishing. 717 ->
# 209 came from the tests taking the client as a fixture rather than a module
# global; 209 -> 116 from the repository interfaces becoming Protocols and the
# domain services asking for the narrow ports in `beats.domain.ports` rather
# than a whole repository. What is left is mostly dynamic **kwargs splats in
# test factories, which no annotation can rescue. `scripts/ty_budget.py` holds
# the line at the current count, so a new diagnostic fails CI even though the
# existing ones do not.
error-on-warning = false

[tool.ty.rules]
# Suppress false positives from PyMongo/Pydantic dynamic types until ty matures
unresolved-attribute = "warn"
invalid-argument-type = "warn"
invalid-type-form = "warn"
no-matching-overload = "warn"
missing-argument = "warn"  # pydantic-settings fills required fields from env vars
invalid-yield = "warn"  # Anthropic SDK stream event type mismatch

[tool.pytest.ini_options]
addopts = "-q --cov=beats --cov-fail-under=65"
testpaths = ["src"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
