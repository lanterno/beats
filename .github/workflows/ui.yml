name: UI
on:
  workflow_dispatch:
  push:
    paths: [ui/**, .github/workflows/ui.yml]
  # api/src too, on pull requests only: the generated types follow the API's
  # schema, and a push to main from an API change must not redeploy the SPA.
  pull_request:
    paths: [ui/**, api/src/**, .github/workflows/ui.yml]

# Read the code, nothing more; a job that needs a write asks for it itself.
permissions:
  contents: read

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # uv is needed by gen:types:check, which dumps the OpenAPI spec from the API.
      - uses: astral-sh/setup-uv@v9.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Fail CI if the committed OpenAPI types drift from the API schema. Was
      # previously only enforced in the pre-push hook (skippable / not in CI).
      # dump_openapi.py imports the app, which needs a JWT_SECRET and a
      # REPORT_LINK_KEY (each >=32 bytes) to build Settings(); neither value
      # affects the emitted schema.
      - run: pnpm gen:types:check
        env:
          JWT_SECRET: ci_openapi_dump_placeholder_secret_0123456789
          REPORT_LINK_KEY: ci_openapi_dump_placeholder_report_key_0123456789
      - run: pnpm test
      - run: pnpm build

  # Deploys the SPA to Firebase Hosting, which is what serves lifepete.com.
  #
  # This is the live deployment, and nothing local resembles it: here the SPA
  # and the API are split across lifepete.com and api.lifepete.com, which is
  # why `origins` in api/src/server.py lists both — drop either half and the
  # site breaks in a browser while everything in CI stays green.
  #
  # The API half of this same deployment ships separately, via api/cloudbuild.yaml.
  deploy:
    name: Deploy to Firebase Hosting
    needs: quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Firebase action reports the deploy as a check run ("Production
    # deploy succeeded") with the repo token.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Unlike the self-hosted stack (ui/Dockerfile builds with VITE_API_URL=""
      # because it is same-origin), this deployment is cross-origin and has to
      # name the API explicitly.
      - run: pnpm build
        env:
          VITE_API_URL: https://api.lifepete.com
          VITE_GIT_SHA: ${{ github.sha }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: beats-476914
          entryPoint: ui
