# The control plane's UI (docs/backoffice.md). Like ui.yml's quality job:
# runs on pull requests that touch backoffice/ or api/src/ (the generated
# types follow the operator API's schema), and on pushes that touch
# backoffice/. No deploy job — Cloud Build ships it inside the API image.
name: Backoffice
on:
  workflow_dispatch:
  push:
    paths: [backoffice/**, .github/workflows/backoffice.yml]
  pull_request:
    paths: [backoffice/**, api/src/**, .github/workflows/backoffice.yml]

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: backoffice/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: backoffice/pnpm-lock.yaml
      # uv dumps the operator API's OpenAPI spec for gen:types:check.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm gen:types:check
      - run: pnpm test
      - run: pnpm build
