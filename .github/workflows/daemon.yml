name: Daemon
on:
  push:
    paths: [daemon/**, HomebrewFormula/**, .github/workflows/daemon.yml]
  pull_request:
    paths: [daemon/**, HomebrewFormula/**, .github/workflows/daemon.yml]

# Read the code, nothing more; a job that needs a write asks for it itself.
permissions:
  contents: read

jobs:
  quality:
    name: Vet & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          # go.mod is in daemon/, not at the root setup-go looks in.
          cache-dependency-path: daemon/go.sum
      # gofmt is enforced locally via lefthook, but a contributor
      # without the hook installed could push unformatted Go through
      # to CI otherwise. `gofmt -l` prints any unformatted file; if
      # the output is non-empty, fail the run with a clear message.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would reformat the following files — run 'gofmt -w .' on them:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      # `go vet ./...` only ever sees the host's build tags, so the
      # windows-only collector files (appinfo_windows.go,
      # idletime_windows.go, cadence_windows.go) would be invisible to
      # this job and first compile on a release runner. Vetting the
      # windows target explicitly closes that gap. darwin can't be
      # vetted from here — cadence_darwin.go is cgo — so it stays
      # covered by the macos build matrix below.
      - name: Vet (windows target)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      # staticcheck catches a class `go vet` does not: unused results,
      # impossible type assertions, deprecated stdlib calls, dead branches.
      # Pinned rather than @latest so a new release can't fail an unrelated PR.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # The app-label table is generated into three languages from one JSON
      # file; fail if this repo's copy has drifted from the source.
      - name: app-label tables are current
        run: python3 ../scripts/gen_app_labels.py --check
      - run: go test ./... -v -race

  # The formula in HomebrewFormula/ is what `brew install beatsd` reads from
  # main, and release-daemon.yml rewrites its version and checksums with
  # bump.sh on every release. Checking both here fails a broken formula, or
  # one bump.sh no longer matches, in review instead of on users' machines
  # or at release.
  formula:
    name: Homebrew formula
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v7
      - run: ruby -c HomebrewFormula/beatsd.rb
      # Dummy sidecars, a different checksum per archive, against a copy:
      # bump.sh reads its result back and fails unless each checksum landed
      # on the line after its own archive's url.
      - name: bump.sh matches the formula
        run: |
          sidecars="${RUNNER_TEMP}/sidecars"
          mkdir -p "$sidecars"
          n=0
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            n=$((n + 1))
            archive="beatsd-${platform}.tar.gz"
            printf '%064d  %s\n' "$n" "$archive" > "${sidecars}/${archive}.sha256"
          done
          cp HomebrewFormula/beatsd.rb "${RUNNER_TEMP}/beatsd.rb"
          HomebrewFormula/bump.sh 0.0.1 "$sidecars" "${RUNNER_TEMP}/beatsd.rb"
          ruby -c "${RUNNER_TEMP}/beatsd.rb"
      # The runner image ships Homebrew at /home/linuxbrew, off the PATH.
      # `brew style` on a bare file applies the rules for Homebrew's own
      # code, so the formula goes in a throwaway tap, as a tap's would.
      - name: brew style
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git beats-ci/check
          cp HomebrewFormula/beatsd.rb "$(brew --repository beats-ci/check)/Formula/beatsd.rb"
          brew style beats-ci/check/beatsd

  # The windows collector is the one surface with no coverage from the
  # ubuntu job: its Raw Input sink can only be exercised on a real
  # Windows session. This job runs the windows-tagged tests so window
  # creation, device registration and teardown are proven rather than
  # assumed.
  windows-tests:
    name: Test (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          # go.mod is in daemon/, not at the root setup-go looks in.
          cache-dependency-path: daemon/go.sum
      - run: go test ./... -v

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: quality
    # darwin builds run on macOS so the cgo cadence event tap
    # (cadence_darwin.go) compiles; cross-compiling darwin from Linux
    # with CGO_ENABLED=0 drops that file and breaks the build.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          # windows cross-compiles cleanly from ubuntu: the collector's
          # Raw Input path uses golang.org/x/sys/windows, which is pure
          # Go syscall wrappers, so no mingw toolchain is involved.
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      # cgo on for darwin (native macOS clang); off everywhere else so
      # the binaries stay statically linked and cross-compilable.
      CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
      # Windows needs the .exe suffix; with an explicit -o, Go writes
      # exactly the name it's given rather than adding one.
      EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          # go.mod is in daemon/, not at the root setup-go looks in.
          cache-dependency-path: daemon/go.sum
      - run: go build -o beatsd-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/beatsd/
      - uses: actions/upload-artifact@v7
        with:
          name: beatsd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: daemon/beatsd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
