name: Daemon
on:
  push:
    paths: [daemon/**]
  pull_request:
    paths: [daemon/**]

jobs:
  quality:
    name: Vet & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # gofmt is enforced locally via lefthook, but a contributor
      # without the hook installed could push unformatted Go through
      # to CI otherwise. `gofmt -l` prints any unformatted file; if
      # the output is non-empty, fail the run with a clear message.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would reformat the following files — run 'gofmt -w .' on them:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      # `go vet ./...` only ever sees the host's build tags, so the
      # windows-only collector files (appinfo_windows.go,
      # idletime_windows.go, cadence_windows.go) would be invisible to
      # this job and first compile on a release runner. Vetting the
      # windows target explicitly closes that gap. darwin can't be
      # vetted from here — cadence_darwin.go is cgo — so it stays
      # covered by the macos build matrix below.
      - name: Vet (windows target)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - run: go test ./... -v -race

  # The windows collector is the one surface with no coverage from the
  # ubuntu job: its Raw Input sink can only be exercised on a real
  # Windows session. This job runs the windows-tagged tests so window
  # creation, device registration and teardown are proven rather than
  # assumed.
  windows-tests:
    name: Test (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: go test ./... -v

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: quality
    # darwin builds run on macOS so the cgo cadence event tap
    # (cadence_darwin.go) compiles; cross-compiling darwin from Linux
    # with CGO_ENABLED=0 drops that file and breaks the build.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          # windows cross-compiles cleanly from ubuntu: the collector's
          # Raw Input path uses golang.org/x/sys/windows, which is pure
          # Go syscall wrappers, so no mingw toolchain is involved.
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      # cgo on for darwin (native macOS clang); off everywhere else so
      # the binaries stay statically linked and cross-compilable.
      CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
      # Windows needs the .exe suffix; with an explicit -o, Go writes
      # exactly the name it's given rather than adding one.
      EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: go build -o beatsd-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/beatsd/
      - uses: actions/upload-artifact@v7
        with:
          name: beatsd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: daemon/beatsd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
