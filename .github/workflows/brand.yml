name: Brand
on:
  push:
    paths: [shared/brand.json, scripts/gen_brand.py, api/**, ui/**, companion/**, .github/workflows/brand.yml]
  pull_request:
    paths: [shared/brand.json, scripts/gen_brand.py, api/**, ui/**, companion/**, .github/workflows/brand.yml]

# Read the code, nothing more; a job that needs a write asks for it itself.
permissions:
  contents: read

jobs:
  # The product name is stamped from shared/brand.json into three surfaces, and
  # none of their own workflows runs when only the JSON changes. Stdlib only.
  name-is-current:
    name: Product name is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/gen_brand.py --check
