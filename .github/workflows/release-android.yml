name: Release Android
# Builds the companion as a signed Android App Bundle for Google Play.
#
#   git tag companion-v1.0.0 && git push origin companion-v1.0.0
#
# or run it by hand from the Actions tab (it then builds from the branch
# picked there, as version <pubspec version>). A tag also attaches the
# bundle to a GitHub release.
#
# Signing uses the upload key — not the app signing key, which Google holds
# (Play App Signing). The key lives in two repo secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64    the PKCS12 keystore, base64
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  its password (the key's is the same)
# Their source is the maintainer's vault (github.com/lanterno/vault, project
# beats): `vault gh beats` sets both from it. Lose the vault and the upload
# key can be reset from the Play Console; it can't be recovered.
#
# versionCode is this workflow's run number: it only ever goes up, which is
# all Play asks of it.
#
# Once PLAY_SERVICE_ACCOUNT_JSON is set (a Play Console service account with
# release rights), the bundle also goes to the internal testing track as a
# draft, to roll out from the console. The first upload of a new app must be
# made by hand in the console; the API can only add to an app that has one.

on:
  push:
    tags:
      - "companion-v*"
  workflow_dispatch:

permissions:
  contents: write # the GitHub release, on a tag

jobs:
  bundle:
    name: Signed app bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/companion-v* ]]; then
            name="${GITHUB_REF#refs/tags/companion-v}"
          else
            name=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $name ($GITHUB_RUN_NUMBER)"

      - name: Upload key
        working-directory: companion/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD must be set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' \
            "$PASSWORD" "$PASSWORD" > key.properties

      # The store's build pairs with lifepete.com unless someone names their own server.
      - run: >-
          flutter build appbundle --release
          --dart-define-from-file=config/lifepete.json
          --build-name ${{ steps.version.outputs.name }}
          --build-number ${{ steps.version.outputs.code }}

      - name: 16 KB page alignment
        run: bash android/check-16kb.sh build/app/outputs/bundle/release/app-release.aab

      - name: Name the bundle
        id: bundle
        run: |
          out="lifepete-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$out"
          echo "path=companion/$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: lifepete-android-bundle
          path: ${{ steps.bundle.outputs.path }}

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/companion-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.path }}

      - name: Internal testing track (draft)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: space.elghareeb.beats
          releaseFiles: ${{ steps.bundle.outputs.path }}
          track: internal
          status: draft

      - name: Forget the key
        if: always()
        working-directory: companion/android
        run: rm -f app/upload-keystore.jks key.properties
