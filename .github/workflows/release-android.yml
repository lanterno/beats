name: Release Android
# Publishing a GitHub release ships the companion to Google Play.
#
#   gh release create companion-v1.2.0 --generate-notes             # → PLAY_RELEASE_TRACK
#   gh release create companion-v1.2.0-rc.1 --prerelease --generate-notes   # → internal
#
# (or Releases → Draft a new release on GitHub, tag companion-v…, Publish).
# The workflow tests, builds the bundle signed with the upload key, attaches
# it to the release, and uploads it to Play with the app's changes since the
# previous companion release as "What's new". A pre-release goes to the internal testing track; a full
# release goes to the track named by the repo variable PLAY_RELEASE_TRACK —
# `alpha` (the closed test) until production access is granted, then
# `production`. There is no default: a full release with the variable unset
# fails rather than guessing where the public build goes.
#
# Run by hand from the Actions tab, it only builds: the bundle is kept as an
# artifact, nothing is uploaded.
#
# Signing uses the upload key — not the app signing key, which Google holds
# (Play App Signing). The key lives in two repo secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64    the PKCS12 keystore, base64
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  its password (the key's is the same)
# Play access is a third:
#   PLAY_SERVICE_ACCOUNT_JSON         key of play-publisher@beats-476914, a
#                                     service account with no Cloud roles; it
#                                     can only do what Play Console's Users and
#                                     permissions grant it, for this app
# All three come from the maintainer's vault (github.com/lanterno/vault,
# project beats): `vault gh beats` sets them. Lose the vault and the upload
# key can be reset from the Play Console; it can't be recovered.
#
# versionCode is this workflow's run number: it only ever goes up, which is
# all Play asks of it. versionName is the tag without `companion-v`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach the bundle to the release

# One release at a time: two uploads racing for the same track would leave
# whichever committed second.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  bundle:
    name: Signed app bundle
    # A release of anything else in this repo (the daemon, the extension) is
    # not the companion's.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'companion-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags and merges What's new is built from
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

      - name: Version and track
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TRACK: ${{ vars.PLAY_RELEASE_TRACK }}
          HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          code="${{ github.run_number }}"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            if [ "$HAS_PLAY_KEY" != true ]; then
              echo "::error::PLAY_SERVICE_ACCOUNT_JSON isn't set, so a release can't reach Google Play"
              exit 1
            fi
            if ! [[ "$TAG" =~ ^companion-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
              echo "::error::release tag $TAG isn't companion-v<major>.<minor>.<patch>[-pre]"
              exit 1
            fi
            name="${BASH_REMATCH[1]}"
            if [ "$PRERELEASE" = true ]; then
              track=internal
            elif [ -n "$RELEASE_TRACK" ]; then
              track="$RELEASE_TRACK"
            else
              echo "::error::set the repo variable PLAY_RELEASE_TRACK (alpha, or production once it's granted) to publish a full release"
              exit 1
            fi
          else
            name=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
            track=
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "track=$track"
          } >> "$GITHUB_OUTPUT"
          echo "Building $name ($code)${track:+ for the $track track}"

      - name: Upload key
        working-directory: companion/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD must be set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' \
            "$PASSWORD" "$PASSWORD" > key.properties

      # The store's build pairs with lifepete.com unless someone names their own server.
      - run: >-
          flutter build appbundle --release
          --dart-define-from-file=config/lifepete.json
          --build-name ${{ steps.version.outputs.name }}
          --build-number ${{ steps.version.outputs.code }}

      - name: 16 KB page alignment
        run: bash android/check-16kb.sh build/app/outputs/bundle/release/app-release.aab

      - name: Name the bundle
        id: bundle
        run: |
          out="lifepete-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$out"
          echo "path=companion/$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: lifepete-android-bundle
          path: ${{ steps.bundle.outputs.path }}

      - name: Attach to the release
        if: github.event_name == 'release'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${{ steps.bundle.outputs.path }}" --clobber

      # What's new lists the app's own changes since the previous companion
      # release: the titles of the PRs merged since that tag which changed
      # the app (not its store docs, tests or release scripts). The release's
      # GitHub notes cover the whole repo, so they are used only for the first
      # release, which has no tag to count from. Play takes plain text, at most
      # 500 characters per language; play_notes.py makes it fit.
      - name: What's new
        if: github.event_name == 'release'
        working-directory: .
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          prev=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' 'refs/tags/companion-v*' \
            | grep -vxF "$TAG" | head -1 || true)
          if [ -n "$prev" ]; then
            echo "Changes since $prev"
            NOTES=$(git log --first-parent --merges --format='- %b' "$prev..$TAG" -- companion \
              ':!companion/store' ':!companion/test' ':!companion/*.md' \
              ':!companion/android/*.py' ':!companion/android/*.sh' | grep -v '^[[:space:]]*$' || true)
          else
            echo "No earlier companion release: using the release notes"
            NOTES=$BODY
          fi
          mkdir -p whatsnew
          NOTES=$NOTES python3 companion/android/play_notes.py > whatsnew/whatsnew-en-US
          echo "--- What's new:"; cat whatsnew/whatsnew-en-US

      - name: Forget the key
        if: always()
        working-directory: companion/android
        run: rm -f app/upload-keystore.jks key.properties

      - name: Upload to Google Play (${{ steps.version.outputs.track }})
        if: github.event_name == 'release'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: space.elghareeb.beats
          releaseFiles: ${{ steps.bundle.outputs.path }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ steps.version.outputs.track }}
          status: completed
          whatsNewDirectory: whatsnew
