name: API
on:
  push:
    paths: [api/**, .github/workflows/api.yml]
  pull_request:
    paths: [api/**, .github/workflows/api.yml]

# Read the code, nothing more; a job that needs a write asks for it itself.
permissions:
  contents: read

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --group dev
      - run: uv run ruff check src/
      - run: uv run ruff format --check src/
      - run: uv run ty check src/

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mongo:
        # Not mongo:9, which compose and the test container run: the 8.3 and
        # 9.0 images refuse to start on Linux 6.19+ (SERVER-121912,
        # SERVER-136272), the kernel some GitHub runners now have, and fail the
        # job in "Initialize containers". 8.2 predates that check. Move on once
        # MongoDB ships the TCMalloc fix (AHM-107); a Renovate PR to 9 will fail
        # the same way until then.
        image: mongo:8.3
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_DSN: mongodb://localhost:27017
      DB_NAME: beats_test
      BEATS_TEST_ENV: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --group dev
      - run: uv run pytest src/ -v --cov=beats --cov-report=xml
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          files: api/coverage.xml
          flags: api
