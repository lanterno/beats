# Labels a pull request by the surfaces it touches (the labeler workflow).
# The same labels sort the release notes (release.yml).
api:
  - changed-files:
      - any-glob-to-any-file: ["api/**"]
ui:
  - changed-files:
      - any-glob-to-any-file: ["ui/**"]
companion:
  - changed-files:
      - any-glob-to-any-file: ["companion/**"]
daemon:
  - changed-files:
      - any-glob-to-any-file: ["daemon/**", "HomebrewFormula/**"]
vscode:
  - changed-files:
      - any-glob-to-any-file: ["integrations/vscode-beats/**"]
wall-clock:
  - changed-files:
      - any-glob-to-any-file: ["wall-clock/**"]
infra:
  - changed-files:
      - any-glob-to-any-file:
          ["terraform/**", "**/compose*.yml", "**/cloudbuild.yaml", "justfile", "**/Dockerfile"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", "lefthook.yml", "renovate.json", ".devcontainer/**"]
docs:
  - changed-files:
      - all-globs-to-all-files: ["**/*.md"]
