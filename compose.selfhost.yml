# LifePete, self-hosted: MongoDB, the API, and an nginx that serves the web
# app and proxies `/api`, on one port.
#
# Separate from `api/compose.yml`, which is for local development (it
# publishes Mongo on 27017 and the API on 7999). This file differs in two
# ways that matter:
#
#   1. ONE published port, 6008, on the `web` container. Mongo and the API
#      are on an internal network only, and there is no second origin to
#      keep in sync.
#   2. The web app is built and served here rather than shipped to Firebase.
#
# Required in the environment (the stack refuses to start without them):
#   BEATS_DB_PASSWORD  the MongoDB root password
#   BEATS_RP_ID        the host name the browser sees, e.g. `localhost`
#   BEATS_ORIGIN       the origin the browser sees, e.g. `http://localhost:6008`
# Everything else the API needs (JWT_SECRET, and optionally ANTHROPIC_API_KEY,
# OAuth clients and OIDC_PROVIDERS for single sign-on) comes from api/.env;
# see api/.env.example. `just` (./justfile) wraps the commands below.

name: beats

# The stack's internal network is pinned so the API can name the one proxy it
# believes: nginx (`web`), at a fixed address, appends the address it saw to
# X-Forwarded-For, and the rate limits key on that entry. Only nginx's address
# is trusted, never the whole network: the network's gateway is the docker
# host, and a request nginx receives through it (from the host, or a proxy on
# it) must count as the gateway's, not as whatever the client wrote. Other
# containers draw from the upper half, so none can take nginx's address. If
# the subnet overlaps a network already on the host, `docker compose up` says
# so; change all three together.
x-network-subnet: &network-subnet 172.30.208.0/24
x-network-dynamic-range: &network-dynamic-range 172.30.208.128/25
x-web-address: &web-address 172.30.208.10

services:
  db:
    image: mongo:9
    container_name: beats-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${BEATS_DB_USER:-beats}
      MONGO_INITDB_ROOT_PASSWORD: ${BEATS_DB_PASSWORD:?set BEATS_DB_PASSWORD}
      MONGO_INITDB_DATABASE: beats
    volumes:
      - beats_mongo:/data/db
    networks: [beats]
    # Deliberately no `ports:`. The development compose publishes 27017;
    # this one must not — nothing outside the stack has business reaching the
    # database, and `just backup` runs mongodump inside the container anyway.
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: beats-api:latest
    container_name: beats-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # JWT_SECRET, ANTHROPIC_API_KEY and the OAuth client secrets come from
    # api/.env; the values below override the ones in it that are wrong for
    # this topology (the DSN in particular points at localhost, which inside
    # a container is the container itself).
    env_file:
      - ./api/.env
    environment:
      PORT: 8000
      DB_DSN: mongodb://${BEATS_DB_USER:-beats}:${BEATS_DB_PASSWORD:?set BEATS_DB_PASSWORD}@db:27017/?authSource=admin
      DB_NAME: beats

      # WebAuthn is origin-bound: a passkey registered against one RP ID
      # will not work against another, so the ceremony has to name the host
      # the browser actually sees. No default: a wrong one fails every
      # passkey, quietly.
      WEBAUTHN_RP_ID: ${BEATS_RP_ID:?set BEATS_RP_ID to the host name the browser sees}
      WEBAUTHN_ORIGIN: ${BEATS_ORIGIN:?set BEATS_ORIGIN to the origin the browser sees}

      # The proxy whose X-Forwarded-For is believed: nginx, at its fixed
      # address (top of this file). Set here, not in api/.env, because it is
      # a fact of this topology, and it overrides the env file's value.
      FORWARDED_ALLOW_IPS: *web-address
    networks: [beats]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: beats-web:latest
    container_name: beats-web
    restart: unless-stopped
    depends_on:
      # `service_healthy`, not a bare `depends_on`. nginx resolves upstream
      # hostnames once, at startup, and exits if `api` does not resolve yet --
      # so a plain start-ordering dependency gives a crash loop on a cold
      # boot rather than a wait.
      api:
        condition: service_healthy
    ports:
      # The stack's one port. Same number inside and out, so
      # `http://localhost:6008` is the same URL in both worlds.
      - "6008:6008"
    networks:
      beats:
        # The address the API believes X-Forwarded-For from (top of this file).
        ipv4_address: *web-address

networks:
  beats:
    name: beats
    ipam:
      config:
        - subnet: *network-subnet
          ip_range: *network-dynamic-range

volumes:
  beats_mongo:
    name: beats-mongo-data
