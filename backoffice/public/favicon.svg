<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>LifePete</title>
  <!-- No tile: a tab strip is its own background. Deeper gold and a slate
       track for a light strip, the dusk gold and a pale track for a dark one. -->
  <style>
    .track { stroke: #7C93A8; stroke-opacity: 0.45; }
    .arc { stroke: #E19A1F; }
    .sun { fill: #E19A1F; }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #FFFFFF; stroke-opacity: 0.3; }
      .arc { stroke: #F5C35E; }
      .sun { fill: #F5C35E; }
    }
  </style>
  <circle class="track" cx="16" cy="16" r="11.5" fill="none" stroke-width="4"/>
  <path class="arc" d="M16 4.5A11.5 11.5 0 1 1 6.04 21.75" fill="none" stroke-width="4" stroke-linecap="round"/>
  <circle class="sun" cx="6.04" cy="21.75" r="4.4"/>
</svg>
